[project]
name = "sphcap"
version = "0.2.0"
description = "Spherical cap discrepancy: configurations, exact/approximate computation, and gradient-based minimization."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]


[project.optional-dependencies]
gpu = ["torch>=2.0"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]
precision = ["mpmath>=1.3", "sympy>=1.12", "python-flint>=0.6"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sphcap*"]

[tool.setuptools.package-data]
sphcap = ["data/*.json"]
